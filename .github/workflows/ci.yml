name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check compilation
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Standard public Intel runners retain macOS coverage without the ARM pool.
        os: [ubuntu-latest, macos-15-intel]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: check-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            check-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Check
        run: cargo check --workspace --all-targets --locked

  fmt:
    name: Check formatting
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Check Clippy
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: clippy-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            clippy-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Run tests (${{ matrix.name }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: macos
            os: macos-15-intel
          - name: musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: windows
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: test-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-cargo-

      # Tests spawn sh to run script-based hooks/predicates.
      - name: Put sh on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"

      - name: Verify sh is available (Windows)
        if: runner.os == 'Windows'
        run: sh --version

      # Keep later test binaries observable when one binary fails.
      - name: Test
        shell: bash
        run: |
          unset SYMPOSIUM_ENABLE_AGENT_TESTING SYMPOSIUM_TEST_AGENT
          printf 'test-agents = []\n' > test-agents.toml
          cargo test --workspace --locked --no-fail-fast ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Diagnose intermittent discovery fixture (temporary)
        if: matrix.name == 'ubuntu'
        shell: bash
        run: |
          unset SYMPOSIUM_ENABLE_AGENT_TESTING SYMPOSIUM_TEST_AGENT
          failed_attempts=0
          for attempt in {1..40}; do
            printf 'Parallel library diagnostic attempt %s/40\n' "$attempt"
            if cargo test -p symposium --lib --locked -- --quiet; then
              printf 'Diagnostic attempt passed\n'
            else
              failed_attempts=$((failed_attempts + 1))
            fi
          done
          test "$failed_attempts" -eq 0

  library-features:
    name: Library features (${{ matrix.package }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [symposium-sdk, symposium-install]
        mode: [minimal, clap]
        include:
          - mode: minimal
            feature_args: ''
          - mode: clap
            feature_args: '--features clap'

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: library-${{ matrix.package }}-${{ matrix.mode }}-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            library-${{ matrix.package }}-${{ matrix.mode }}-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Check, lint, and test standalone library
        shell: bash
        run: |
          unset SYMPOSIUM_ENABLE_AGENT_TESTING SYMPOSIUM_TEST_AGENT
          cargo check -p ${{ matrix.package }} --lib --locked --no-default-features ${{ matrix.feature_args }}
          cargo clippy -p ${{ matrix.package }} --lib --locked --no-default-features ${{ matrix.feature_args }} -- -D warnings
          cargo test -p ${{ matrix.package }} --lib --locked --no-default-features ${{ matrix.feature_args }}

  xtask:
    name: Run xtask checks
    timeout-minutes: 45
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: docs-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            docs-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install book tooling
        shell: bash
        run: |
          cargo install mdbook --version 0.5.2 --locked --root "$RUNNER_TEMP/symposium-doc-tools"
          cargo install mdbook-mermaid --version 0.17.1 --locked --root "$RUNNER_TEMP/symposium-doc-tools"
          printf '%s\n' "$RUNNER_TEMP/symposium-doc-tools/bin" >> "$GITHUB_PATH"

      - name: Check documentation
        shell: bash
        run: |
          cargo run --locked -p xtask -- md-orphan-check
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
          mdbook build
          git diff --check
